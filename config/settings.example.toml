# VisionBench settings.
#
# Copy this file to config/settings.toml (git-ignored) and paste your key below:
#     cp config/settings.example.toml config/settings.toml
# The ANTHROPIC_API_KEY environment variable is used when api_key is left empty.

[anthropic]
api_key = ""            # sk-ant-...
max_retries = 4
timeout_seconds = 900

[huggingface]
token = ""              # hf_... only needed for gated sets (ZeroBench); accept their terms on the Hub first

# ---------------------------------------------------------------------------
# Subjects: the models being evaluated.
# ---------------------------------------------------------------------------
[subject]
models = ["claude-opus-5-5"]
effort = "high"          # low | medium | high | xhigh | max
max_tokens = 32000
# Server-side refusal fallback silently swaps in another model, which would
# attribute that model's answer to the subject. Keep it off for subjects;
# refusals are scored as a separate outcome instead.
fallbacks = false

# ---------------------------------------------------------------------------
# Judges: LLM-as-judge for rubric items, process (error) attribution and
# answer-equivalence fallback. Programmatic verifiers always take precedence.
# ---------------------------------------------------------------------------
[judge]
model = "claude-opus-5-5"
effort = "high"
max_tokens = 16000
samples = 3              # independent judge samples, majority vote per rubric item
fallbacks = true         # a fallback judge is fine: it doesn't change what is being measured
show_image = true        # judges see the image as well as the reference facts

# ---------------------------------------------------------------------------
# Harness
# ---------------------------------------------------------------------------
[harness]
mode = "direct"          # direct | agentic
max_turns = 12           # agentic: model<->tool round trips per attempt
zoom_tool = true         # agentic: local crop/zoom tool
code_execution = false   # agentic: Anthropic server-side sandbox (image uploaded via Files API)
max_image_side = 1568    # images are downscaled to fit this before sending

# ---------------------------------------------------------------------------
# Run
# ---------------------------------------------------------------------------
[run]
concurrency = 8
samples_per_item = 3     # k independent attempts per item -> pass@1, pass@k, pass^k
blind_control = true     # also run every item with the image withheld
process_judge = false    # LLM error attribution (perception vs reasoning) on failures
output_dir = "runs"
dataset_dir = "datasets"
# Secret for the private test split (`visionbench build NAME --split test`). Keep it out of git;
# rotate it to mint a fresh, uncontaminated test set.
private_seed_secret = ""

# ---------------------------------------------------------------------------
# Prices in USD per million tokens, for cost reporting.
# ---------------------------------------------------------------------------
[prices]
"claude-fable-5-1" = { input = 10.0, output = 50.0 }
"claude-opus-5-5" = { input = 4.0, output = 20.0 }
"claude-opus-5" = { input = 5.0, output = 25.0 }
"claude-sonnet-5-5" = { input = 2.0, output = 10.0 }
"claude-haiku-5-5" = { input = 0.10, output = 0.50 }
