[project]
name = "visionbench"
version = "0.1.0"
description = "Verifiable visual-reasoning evaluation: procedurally generated tasks, agentic harness, programmatic + rubric verifiers, rigorous statistics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "pillow>=10",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "openai>=1.40",         # OpenRouter (OpenAI-compatible) for cross-vendor subjects
    "huggingface_hub>=0.24",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
visionbench = "visionbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["visionbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
